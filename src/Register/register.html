<body>
    <div id="app"></div>
    
    <div class="container-form">
      
        <div class="form-content">
            <h2>Registro de Usuario</h2>
            <form id="registerForm">

                <div class="input-group">

                    <div class="input-field">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="userName" placeholder="Nombre">
                    </div>

                    <div class="input-field">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" placeholder="Email">
                    </div>

                    <div class="input-field">
                        <i class="fa-solid fa-key"></i>
                        <input type="password" id="password" placeholder="Contraseña">
                    </div>

                    <div class="input-field">
                        <i class="fa-solid fa-key"></i>
                        <input type="password" id="confirmPassword" placeholder="Confirmación de contraseña">
                    </div>

                    <div class="input-field">
                        <i class="fa-solid fa-user-circle"></i>
                        <input type="text" id="firstName" placeholder="Primer nombre">
                    </div>

                    <div class="input-field">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="lastName" placeholder="Apellido">
                    </div>
                    <p class="fn"> Fecha de nacimiento </p>
                    <div class="input-field">
                        <i class="fa-solid fa-calendar"></i>
                        <input type="date" id="date" placeholder="Fecha de nacimiento">
                    </div>

                </div>

                <div class="btn-field">
                    <button type="submit"> Registrarse</button>
                    <a href="../Login/login.html">Regresar</a>
                </div>

                <p id="errorMessage"></p>

            </form>
        </div>
    </div>

    <script src="/src/Register/register.js" type="module"></script>
   
</body>
